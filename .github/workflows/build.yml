name: Build and Test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java-version: [25, 26-ea]
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build ${{ matrix.java-version }}
        env:
          MAVEN_OPTS: -Xmx1g
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mvn -B clean test -Dsurefire.excludes='**/MMapDataAccessTest.java'
          else
            mvn -B clean test
          fi
